services:
  tdm1:
    image: quakeliveserverstandards/duel
    restart: always
    ports:
      - '27970:27970/udp' # game port
      - '27970:27970/tcp' # stats port
      - '28970:28970' # rcon port
    labels:
      autoheal-app: true
    environment:
      - NET_PORT=27970
      - ZMQ_RCON_PORT=27970
      - ZMQ_STATS_PORT=28970
      - 'SV_HOSTNAME=[TDM] [#1] by twitch.tv/AktiveHateX'
      - SV_TAGS=tdm, moscow, russia, aktivehatex
      - SERVERSTARTUP=map bloodrun hoq_tdm
      - SV_MAXCLIENTS=20
      - SV_PRIVATECLIENTS=2
      - SV_PRIVATEPASSWORD=12345678
    volumes:
      - './../access.txt:/home/steam/ql/baseq3/access.txt'
      - './../autoexec.cfg:/home/steam/ql/baseq3/autoexec.cfg'
      - './../../configs/standard/server.cfg:/home/steam/ql/baseq3/server.cfg'
      - './../../factories/standard/tdm/tdm.factories:/home/steam/ql/baseq3/scripts/tdm.factories'
      - './../../mappools/standard/tdm/mappool.txt:/home/steam/ql/baseq3/mappool.txt'
      - './../../minqlx-plugins/standard/common:/home/steam/ql/minqlx-plugins'
      - './../../workshop/standard/tdm/workshop.txt:/home/steam/ql/baseq3/workshop.txt'
    depends_on:
      - redis
    healthcheck:
      test: curl -f -LI http://0.0.0.0:9999 || exit 1
      interval: 5m
      timeout: 10s
      retries: 5

